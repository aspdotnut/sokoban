name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            bin: sokoban
          - os: windows-latest
            name: windows
            bin: sokoban.exe
          - os: macos-latest
            name: macos
            bin: sokoban
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.bin }} dist/sokoban-${{ matrix.name }}${{ matrix.name == 'windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: sokoban-${{ matrix.name }}
          path: dist/*

  build-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + cargo-3ds + cargo-get
        run: |
          apt-get update && apt-get install -y clang libclang-dev
          export CARGO_HOME=/root/.cargo
          export RUSTUP_HOME=/root/.rustup
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
          echo "CARGO_HOME=/root/.cargo" >> $GITHUB_ENV
          echo "RUSTUP_HOME=/root/.rustup" >> $GITHUB_ENV
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
          echo "/root/.cargo/bin" >> $GITHUB_PATH
          echo "/opt/devkitpro/devkitARM/bin" >> $GITHUB_PATH
          . "$CARGO_HOME/env"
          rustup default nightly
          rustup component add rust-src
          cargo install cargo-3ds cargo-get

      - name: Build ELF
        run: cargo 3ds build --release

      - name: Build makerom from source
        run: |
          apt-get update && apt-get install -y git build-essential
          git clone --recursive https://github.com/3DSGuy/Project_CTR.git
          cd Project_CTR/makerom
          make -C deps/libmbedtls
          make -C deps/libblz
          make -C deps/libyaml
          make
          cp bin/makerom /usr/local/bin/

      - name: Build CIA
        run: |
          mkdir -p out
          makerom \
            -elf ./target/armv6k-nintendo-3ds/release/sokoban.elf \
            -banner ./banner/banner.bnr \
            -icon ./banner/icon.icn \
            -rsf ./app.rsf \
            -ver $(cargo get package.version) \
            -f cia \
            -o ./out/sokoban-3ds.cia

      - uses: actions/upload-artifact@v4
        with:
          name: sokoban-3ds
          path: out/*.cia

  release:
    needs: [build-native, build-3ds]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
