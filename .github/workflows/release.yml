name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            bin: sokoban
          - os: windows-latest
            name: windows
            bin: sokoban.exe
          - os: macos-latest
            name: macos
            bin: sokoban
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.bin }} dist/${{ matrix.bin }}
      - uses: actions/upload-artifact@v6
        with:
          name: sokoban-${{ matrix.name }}
          path: dist/*

  build-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v6

      - name: Set up devkitARM env
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
          echo "/opt/devkitpro/devkitARM/bin" >> $GITHUB_PATH
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cargo-3ds + cargo-get
        run: cargo install cargo-3ds cargo-get

      - name: Install Clang
        run: |
          apt-get update && apt-get install -y clang libclang-dev

      - name: Build ELF
        run: cargo 3ds build --release

      - name: Build makerom from source
        run: |
          apt-get update && apt-get install -y git build-essential
          git clone --recursive https://github.com/3DSGuy/Project_CTR.git
          cd Project_CTR/makerom
          make -C deps/libmbedtls
          make -C deps/libblz
          make -C deps/libyaml
          make
          cp bin/makerom /usr/local/bin/

      - name: Build CIA
        shell: bash
        run: |
          mkdir -p out
          VERSION=$(cargo get package.version)
          IFS='.' read -r VER_MAJOR VER_MINOR VER_MICRO <<< "$VERSION"
          makerom \
            -elf ./target/armv6k-nintendo-3ds/release/sokoban.elf \
            -banner ./banner/banner.bnr \
            -icon ./banner/icon.icn \
            -rsf ./app.rsf \
            -major "$VER_MAJOR" \
            -minor "$VER_MINOR" \
            -micro "$VER_MICRO" \
            -f cia \
            -o ./out/sokoban-3ds.cia

      - uses: actions/upload-artifact@v6
        with:
          name: sokoban-3ds
          path: out/*.cia

  release:
    needs: [build-native, build-3ds]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          chmod +x artifacts/sokoban-linux/sokoban artifacts/sokoban-macos/sokoban
          tar -czf release/sokoban-linux.tar.gz -C artifacts/sokoban-linux sokoban
          tar -czf release/sokoban-macos.tar.gz -C artifacts/sokoban-macos sokoban
          zip -j release/sokoban-windows.zip artifacts/sokoban-windows/sokoban.exe
          cp artifacts/sokoban-3ds/sokoban-3ds.cia release/
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
